<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spots Project Landing Page" />
    <meta name="author" content="Joao Longo" />
    <meta name="keywords" content="HTML, CSS, IMG" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>Spots</title>
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header">
        <img
          src="<%=require('./images/Logo(1).svg')%>"
          alt="Spot logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img
                src="<%=require('./images/pencil-lightOk.svg')%>"
                alt="pencil icon"
                class="profile__pencil-icon"
              />
            </button>
            <img
              src="<%=require('./images/Avatar-new.jpg')%>"
              alt="Bessie Coleman"
              class="profile__avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img
                src="<%=require('./images/plus.svg')%>"
                alt="Pencil icon"
              />Edit Profile
            </button>
          </div>
          <button type="button" class="profile__new-post-btn">
            <img src="<%=require('./images/plus.svg')%>" alt="Plus icon" /> New
            Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button class="card__delete-button" type="button"></button>
                <img src="#" alt="" class="card__image" />
                <div class="card__footer">
                  <h2 class="card__title"></h2>
                  <button
                    aria-label="Like card"
                    type="button"
                    class="card__like-button"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">2024 &copy; Spots</p>
      </footer>
    </div>
    <div class="modal" id="edit-profile-modal">
      <div class="modal__content">
        <button
          aria-label="Close modal"
          type="button"
          class="modal__close"
        ></button>
        <h3 class="modal__title">Edit profile</h3>
        <form class="modal__form" id="edit-profile-form" novalidate>
          <label for="profile-name-input" class="modal__label">
            Name
            <input
              id="profile-name-input"
              type="text"
              class="modal__input"
              name="name"
              placeholder="Type your name"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="modal__error" id="profile-name-input-error"></span>
          </label>
          <label for="profile-description-input" class="modal__label">
            Description
            <input
              id="profile-description-input"
              type="text"
              class="modal__input"
              name="description"
              placeholder="Describe yourself"
              minlength="2"
              maxlength="200"
              required
            />
            <span
              class="modal__error"
              id="profile-description-input-error"
            ></span>
          </label>
          <button type="submit" class="button modal__button">Save</button>
        </form>
      </div>
    </div>
    <div class="modal" id="add-card-modal">
      <div class="modal__content">
        <button
          aria-label="Close modal"
          type="button"
          class="modal__close"
        ></button>
        <h3 class="modal__title">New post</h3>
        <form class="modal__form" id="card-form" novalidate>
          <label for="card-link-input" class="modal__label">
            Image Link
            <input
              id="card-link-input"
              type="url"
              class="modal__input"
              name="link"
              placeholder="Paste a link to the picture"
              required
            />
            <span id="card-link-input-error" class="modal__error"></span>
          </label>
          <label for="card-caption-input" class="modal__label">
            Caption
            <input
              id="card-caption-input"
              type="text"
              class="modal__input"
              name="caption"
              placeholder="Type your caption"
              minlength="2"
              maxlength="30"
              required
            />
            <span class="modal__error" id="card-caption-input-error"></span>
          </label>
          <button type="submit" class="modal__button">Save</button>
        </form>
      </div>
    </div>
    <div class="modal modal_type_preview" id="preview-modal">
      <div class="modal__image-container">
        <button
          aria-label="Close modal"
          type="button"
          class="modal__close modal__close_type_preview"
        ></button>
        <img src="#" alt="" class="modal__image" />
        <p class="modal__caption"></p>
      </div>
    </div>

    <div class="modal" id="avatar-profile-modal">
      <div class="modal__content">
        <button
          aria-label="Close modal"
          type="button"
          class="modal__close"
        ></button>
        <h3 class="modal__title">Edit avatar</h3>
        <form class="modal__form" id="edit-avatar-form" novalidate>
          <label for="profile-avatar-input" class="modal__label">
            Avatar
            <input
              id="profile-avatar-input"
              class="modal__input"
              name="avatar"
              placeholder="avatar goes here"
              required
            />
            <span class="modal__error" id="profile-avatar-input-error"></span>
          </label>
          <button type="submit" class="button modal__button">Save</button>
        </form>
      </div>
    </div>
    <!-- todo - style the modal -->
    <div class="modal" id="delete-profile-modal">
      <div class="modal__content">
        <button
          aria-label="Close modal"
          type="button"
          class="modal__close"
        ></button>
        <h3 class="modal__title">
          Are you sure you want to delete this image?
        </h3>
        <form class="modal__form" id="delete-form" novalidate>
          <button type="submit" class="button modal__button">Delete</button>
          <button type="button" class="button modal__button">Cancel</button>
        </form>
      </div>
    </div>
  </body>
</html>
